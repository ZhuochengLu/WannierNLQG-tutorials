# ISOLATED MIGRATION DRAFT: not source-bound or runtime-validated; not installed.
# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
identity = "graphene"
source = "julia"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [22, 22]
kind = "bz_mesh"
spatial_dimension = 3

[ response.tasks ]

[ response.tasks.mlg_thg ]
fermi_energy_ev = 0.35
formulation = "both"
kind = "third_harmonic_generation"
output = "both"
photon_energies_ev = [0.0, 0.0001, 0.02, 0.2333333333333333, 0.35, 0.7, 1.2]
response = "both"
temperature_k = 300.0

[ response.tasks.mlg_thg.numerics ]
prescription = "distribution_broadening"
intermediate_regularization = 0.001
eta_correction = true
broadening_type = "Gaussian"
broadening = 0.01
low_frequency_broadening = 0.01
occupation_derivative_mode = "fermi_dirac"

[ response.tasks.mlg_thg.observable ]
components = [[2, 2, 2, 2], [1, 1, 1, 1], [1, 1, 2, 2]]
kind = "tensor_components"
