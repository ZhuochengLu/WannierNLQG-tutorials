# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [4, 4]
kind = "k_slice"
origin = [0.0, 0.0, 0.0]
spatial_dimension = 2
vector_1 = [1.0, 0.0, 0.0]
vector_2 = [0.0, 1.0, 0.0]

[ response.tasks ]

[ response.tasks.kslice_berry_curvature_conventional ]
kind = "berry_curvature"

[ response.tasks.kslice_berry_curvature_conventional.observable ]
bands = [19, 20]
component = [1, 2]
kind = "subspace"
