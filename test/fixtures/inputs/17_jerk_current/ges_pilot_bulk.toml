# ISOLATED MIGRATION DRAFT: not source-bound or runtime-validated; not installed.
# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [7, 5, 1]
kind = "bz_mesh"
spatial_dimension = 3

[ response.tasks ]

[ response.tasks.ges_pilot_bulk ]
fermi_energy_ev = -2.5
kind = "jerk_current"
photon_energies_ev = [2.0, 2.5]
projection = "ordered"
temperature_k = 0.0

[ response.tasks.ges_pilot_bulk.observable ]
components = [[1, 1, 1, 1], [2, 2, 2, 2]]
kind = "tensor_components"
