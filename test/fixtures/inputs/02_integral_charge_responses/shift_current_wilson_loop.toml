# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [2, 2]
kind = "bz_mesh"
spatial_dimension = 2

[ response.tasks ]

[ response.tasks.integral_shift_current_wilson_loop ]
fermi_energy_ev = -2.5
kind = "shift_current"
method = "Wilson_Loop"
photon_energies_ev = [1.0, 2.0, 3.0]
temperature_k = 0.0

[ response.tasks.integral_shift_current_wilson_loop.numerics ]
broadening = 0.06
finite_difference_step = 0.0001
