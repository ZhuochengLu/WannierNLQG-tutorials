# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [4, 4]
kind = "k_slice"
origin = [0.0, 0.0, 0.0]
spatial_dimension = 2
vector_1 = [1.0, 0.0, 0.0]
vector_2 = [0.0, 1.0, 0.0]

[ response.tasks ]

[ response.tasks.kslice_quantum_metric_dipole_conventional ]
kind = "quantum_metric_dipole"

[ response.tasks.kslice_quantum_metric_dipole_conventional.numerics ]
finite_difference_step = 0.0001

[ response.tasks.kslice_quantum_metric_dipole_conventional.observable ]
component = [2, 2, 2]
kind = "kslice"
groups = [[19, 20]]
