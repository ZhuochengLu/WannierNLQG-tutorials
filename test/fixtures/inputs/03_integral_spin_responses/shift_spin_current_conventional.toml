# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"

real_space_operator_bundle_file = "../../../../Materials/GeS/operators.h5"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [2, 2]
kind = "bz_mesh"
spatial_dimension = 2

[ response.tasks ]

[ response.tasks.integral_shift_spin_current_conventional ]
fermi_energy_ev = -2.5
kind = "shift_spin_current"
photon_energies_ev = [1.0, 2.0, 3.0]
temperature_k = 0.0

[ response.tasks.integral_shift_spin_current_conventional.numerics ]
denominator_regularization = 0.001
broadening = 0.06
