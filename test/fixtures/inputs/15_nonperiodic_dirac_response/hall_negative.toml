# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
identity = "dirac/-0.2/1.0"
source = "julia"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [21, 21]
kind = "k_region"
lower = [-1.0, -1.0]
spatial_dimension = 2
upper = [1.0, 1.0]

[ response.tasks ]

[ response.tasks.hall_negative ]
fermi_energies_ev = [-0.4, 0.0, 0.4]
kind = "linear_transport"
temperature_k = 0.0

[ response.tasks.hall_negative.numerics ]
eta_fs_ev = 0.01
fs_kind = "gaussian"

[ response.tasks.hall_negative.relaxation ]
gamma_inter_ev = 0.002
gamma_intra_ev = 0.002
