# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/Fe/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [4, 4]
kind = "k_slice"
origin = [0.0, 0.0, 0.0]
spatial_dimension = 3
vector_1 = [-0.5, 0.5, 0.5]
vector_2 = [0.5, 0.5, -0.5]

[ response.tasks ]

[ response.tasks.berry_tb_occupied_xy ]
fermi_energy_ev = 5.7156290716733436
kind = "berry_curvature"
temperature_k = 0.0

[ response.tasks.berry_tb_occupied_xy.observable ]
component = [1, 2]
kind = "kslice"
occupied_sum = "only"
