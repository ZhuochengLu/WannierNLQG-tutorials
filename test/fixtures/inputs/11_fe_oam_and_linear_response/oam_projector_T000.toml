# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../../Materials/Fe/model_tb.dat"
real_space_operator_bundle_file = "../../../../Materials/Fe/operators.h5"
source = "wannier"

real_space_replica_policy = "auto"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [2, 2, 2]
kind = "bz_mesh"
spatial_dimension = 3

[ response.tasks ]

[ response.tasks.oam_projector_T000 ]
fermi_energies_ev = [5.7156290716733436]
input_semantics = "projected_energy_overlap"
kind = "orbital_magnetization"
method = "Projector"
temperature_k = 0.0

[response.tasks.oam_projector_T000.numerics]
denominator_regularization = 0.001
