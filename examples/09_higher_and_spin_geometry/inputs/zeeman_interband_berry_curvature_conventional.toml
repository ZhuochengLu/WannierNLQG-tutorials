# Editable tutorial input. Numerical values retained; new-default migration is a separate step.
[ model ]
real_space_operator_bundle_file = "../../../Materials/GeS/operators.h5"
model_file = "../../../Materials/GeS/model_tb.dat"
real_space_replica_policy = "auto"
source = "wannier"


[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [200, 200]
kind = "k_slice"
origin = [0.0, 0.0, 0.0]
spatial_dimension = 2
vector_1 = [1.0, 0.0, 0.0]
vector_2 = [0.0, 1.0, 0.0]

[ response.tasks ]

[ response.tasks.kslice_zeeman_interband_berry_curvature_conventional ]
kind = "zeeman_interband_berry_curvature"

[ response.tasks.kslice_zeeman_interband_berry_curvature_conventional.observable ]
component = [1, 3]
kind = "kslice"
groups = [[21, 22], [19, 20]]
