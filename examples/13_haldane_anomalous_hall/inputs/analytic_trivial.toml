# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
identity = "haldane/analytic/trivial"
source = "julia"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [121, 121, 1]
kind = "bz_mesh"
spatial_dimension = 3

[ response.tasks ]

[ response.tasks.analytic_trivial ]
fermi_energy_max_ev = 1.5
fermi_energy_min_ev = -1.5
fermi_energy_num_points = 121
kind = "linear_transport"
temperature_k = 0.0

[ response.tasks.analytic_trivial.numerics ]
eta_fs_ev = 0.01
fs_kind = "gaussian"

[ response.tasks.analytic_trivial.relaxation ]
gamma_inter_ev = 0.02
gamma_intra_ev = 0.02
