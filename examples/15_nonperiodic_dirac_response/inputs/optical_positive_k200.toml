# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
identity = "dirac/0.2/2.0"
source = "julia"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [801, 801]
kind = "k_region"
lower = [-2.0, -2.0]
spatial_dimension = 2
upper = [2.0, 2.0]

[ response.tasks ]

[ response.tasks.optical_positive_k200 ]
fermi_energy_ev = 0.0
kind = "linear_optical_response"
photon_energy_max_ev = 3.0
photon_energy_min_ev = 0.0
photon_energy_num_points = 301
temperature_k = 0.0

[ response.tasks.optical_positive_k200.numerics ]
eta_fs_ev = 0.01
fs_kind = "gaussian"

[ response.tasks.optical_positive_k200.relaxation ]
gamma_inter_ev = 0.02
gamma_intra_ev = 0.02
