# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
identity = "dirac/0.2/32.0"
source = "julia"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [6401, 6401]
kind = "k_region"
lower = [-32.0, -32.0]
spatial_dimension = 2
upper = [32.0, 32.0]

[ response.tasks ]

[ response.tasks.hall_positive_g0001 ]
fermi_energies_ev = [-0.1, 0.0, 0.1]
kind = "linear_transport"
temperature_k = 0.0

[ response.tasks.hall_positive_g0001.numerics ]
eta_fs_ev = 0.01
fs_kind = "gaussian"

[ response.tasks.hall_positive_g0001.relaxation ]
gamma_inter_ev = 0.001
gamma_intra_ev = 0.001
