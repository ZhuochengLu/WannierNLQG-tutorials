# Editable tutorial input. Named-task schema; all supplied parameter values retained.
[ model ]
model_file = "../../../Materials/Fe/model_tb.dat"
source = "wannier"

real_space_replica_policy = "auto"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [40, 40, 40]
kind = "bz_mesh"
spatial_dimension = 3

[ response.tasks ]

[ response.tasks.linear_transport_projector_T000 ]
fermi_energies_ev = [5.7156290716733436]
kind = "linear_transport"
method = "Projector"
temperature_k = 0.0

[ response.tasks.linear_transport_projector_T000.numerics ]
eta_fs_ev = 0.05
fs_kind = "gaussian"

[ response.tasks.linear_transport_projector_T000.relaxation ]
gamma_inter_ev = 0.05
gamma_intra_ev = 0.05
