# Explicit new-default settings; computed with frozen f278 development source.
# Enable only after the stable-source handoff; old regularized/total input is archived.
[ model ]
model_file = "../../../Materials/Fe/model_tb.dat"
real_space_operator_bundle_file = "../../../Materials/Fe/operators.h5"
source = "wannier"

real_space_replica_policy = "auto"

[ response ]

[ response.execution ]
fourier_backend = "direct"

[ response.sampling ]
k_mesh = [200, 200]
kind = "k_slice"
origin = [0.0, 0.0, 0.0]
spatial_dimension = 3
vector_1 = [-0.5, 0.5, 0.5]
vector_2 = [0.5, 0.5, -0.5]

[ response.tasks ]

[ response.tasks.berry_sos_occupied_xy ]
fermi_energy_ev = 5.7156290716733436
kind = "berry_curvature"
temperature_k = 0.0

[ response.tasks.berry_sos_occupied_xy.observable ]
component = [1, 2]
kind = "occupied_bands"

[ response.tasks.berry_sos_occupied_xy.numerics ]
denominator_regularization = 0.0
